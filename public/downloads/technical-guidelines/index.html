<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>INDOWUD nfc — Technical Guidelines</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --ink-950:#15120E;--ink-900:#1C1813;--ink-800:#272219;--ink-700:#383024;--ink-600:#4B4133;
  --husk-50:#FBF8F1;--husk-100:#F5F0E4;--husk-200:#EDE6D5;--husk-300:#E2D8C2;
  --sand-300:#BBAD97;--sand-400:#9A8C76;--sand-500:#786A57;--sand-600:#594E3F;
  --leaf-700:#3C5230;--leaf-600:#4C6A3A;--leaf-500:#5E7E45;--leaf-400:#7E9C60;--leaf-300:#A6C08A;--leaf-200:#CCDCB8;--leaf-100:#E6EEDB;
  --warn:#C18A3A;--danger:#A64B36;
  --fd:'Archivo',system-ui,sans-serif;--fb:'IBM Plex Sans',system-ui,sans-serif;--fm:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;background:#2A2620;font-family:var(--fb);color:var(--ink-700);}
.deck{display:flex;flex-direction:column;align-items:center;gap:22px;padding:34px 0 60px;}
.page{position:relative;width:1123px;height:794px;overflow:hidden;background:var(--husk-50);box-shadow:0 18px 50px rgba(0,0,0,.4);zoom:var(--z,1);}
.page.dark{background:var(--ink-950);color:var(--husk-100);}
.pad{position:absolute;inset:0;padding:60px 70px;display:flex;flex-direction:column;}
.brandline{position:absolute;top:30px;left:70px;right:70px;display:flex;justify-content:space-between;align-items:baseline;}
.wm{display:flex;align-items:baseline;gap:7px;}
.wm b{font-family:var(--fd);font-weight:800;font-size:15px;letter-spacing:-.01em;color:var(--ink-900);}
.dark .wm b{color:var(--husk-50);}
.wm .n{font-family:var(--fm);font-size:8px;font-weight:600;letter-spacing:.24em;color:var(--leaf-600);border:1px solid var(--leaf-500);padding:1px 4px;border-radius:3px;}
.dark .wm .n{color:var(--leaf-300);}
.brandline .meta{font-family:var(--fm);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--sand-400);}
.run{position:absolute;left:70px;right:70px;bottom:30px;display:flex;justify-content:space-between;font-family:var(--fm);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--sand-400);}
.dark .run{color:var(--sand-300);}
.eyebrow{font-family:var(--fm);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--leaf-600);margin:0;}
.dark .eyebrow{color:var(--leaf-300);}
h1.disp{font-family:var(--fd);font-weight:800;letter-spacing:-.025em;line-height:.98;color:var(--ink-900);margin:0;}
.dark h1.disp{color:var(--husk-50);}
h2.head{font-family:var(--fd);font-weight:700;letter-spacing:-.02em;line-height:1.05;color:var(--ink-900);margin:0;}
p.body{font-family:var(--fb);font-size:14px;line-height:1.6;color:var(--ink-600);margin:0;}
.lede{font-size:18px;line-height:1.55;color:var(--ink-700);}
.dark .lede{color:var(--husk-100);}
.rule{height:2px;background:var(--ink-900);width:54px;border:0;margin:0;}
.dark .rule{background:var(--leaf-400);}
.hair{height:1px;background:var(--husk-300);border:0;}
table.dt{width:100%;border-collapse:collapse;font-family:var(--fb);font-size:13px;}
table.dt th{font-family:var(--fm);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--sand-500);text-align:left;padding:10px 12px;border-bottom:2px solid var(--ink-900);font-weight:500;}
table.dt td{padding:9px 12px;border-bottom:1px solid var(--husk-300);color:var(--ink-700);vertical-align:top;}
table.dt tr:nth-child(even) td{background:rgba(226,216,194,.28);}
table.dt td.num,table.dt th.num{text-align:right;font-family:var(--fm);}
table.dt td.hl{font-weight:700;color:var(--leaf-700);}
.mono{font-family:var(--fm);}
.cell{background:#fff;border:1px solid var(--husk-300);border-radius:12px;padding:20px 22px;box-shadow:0 2px 8px rgba(40,32,20,.05);}
.cell .icn{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;background:var(--leaf-100);color:var(--leaf-700);margin-bottom:14px;}
.cell .icn svg{width:21px;height:21px;}
.cell h4{font-family:var(--fd);font-weight:700;font-size:16px;color:var(--ink-900);margin:0 0 6px;}
.cell p{font-family:var(--fb);font-size:12.5px;line-height:1.5;color:var(--ink-600);margin:0;}
.tag{display:inline-flex;align-items:center;font-family:var(--fm);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--husk-50);background:var(--ink-900);padding:5px 10px;border-radius:4px;}
.note{display:flex;gap:12px;padding:8px 0;}
.note .ix{font-family:var(--fm);font-size:11px;color:var(--leaf-600);flex:none;width:24px;}
.callout{background:var(--leaf-100);border-left:3px solid var(--leaf-500);border-radius:6px;padding:14px 18px;}
.callout.warn{background:#F6ECD8;border-color:var(--warn);}
.deer{position:absolute;background-image:url('assets/brand/deer-family.png');background-size:contain;background-repeat:no-repeat;background-position:center;}
.tphoto{background:#fff;border:1px solid var(--husk-300);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(40,32,20,.07);}
.tphoto img{width:100%;height:100%;object-fit:cover;display:block;}
.applies{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--fm);font-size:11px;letter-spacing:.04em;color:var(--sand-500);background:var(--husk-200);border:1px solid var(--husk-300);border-radius:999px;padding:6px 14px;}
.applies b{color:var(--leaf-700);font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:10px;}
.chip2{display:inline-flex;font-family:var(--fm);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--husk-100);background:rgba(242,234,217,.06);border:1px solid rgba(242,234,217,.16);padding:6px 11px;border-radius:999px;}
@media print{@page{size:A4 landscape;margin:0;}html,body{background:#fff;}.deck{display:block;gap:0;padding:0;}.page{zoom:1!important;box-shadow:none;break-after:page;page-break-after:always;}.page:last-child{break-after:auto;}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const IC=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON={
  ruler:IC('<path d="m16 3 5 5L8 21l-5-5Z"/><path d="m9 7 1.5 1.5M12 4l1.5 1.5M6 10l1.5 1.5M7 14l1.5 1.5"/>'),
  grid:IC('<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/>'),
  cnc:IC('<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 20h8M7 9l3 3-3 3M13 15h4"/>'),
  thermo:IC('<path d="M14 14V5a2 2 0 1 0-4 0v9a4 4 0 1 0 4 0Z"/>'),
  drop:IC('<path d="M12 2.7 6.5 9.2A6 6 0 1 0 17.5 9.2Z"/>'),
  layers:IC('<path d="m12 3 9 5-9 5-9-5Z"/><path d="m3 13 9 5 9-5"/>'),
  shield:IC('<path d="M12 3 5 6v5c0 4 3 7 7 9 4-2 7-5 7-9V6Z"/><path d="m9 12 2 2 4-4"/>'),
  print:IC('<path d="M6 9V3h12v6"/><rect x="4" y="9" width="16" height="8" rx="2"/><path d="M7 17h10v4H7Z"/>'),
  hammer:IC('<path d="m15 12-8.5 8.5a2 2 0 0 1-3-3L12 9"/><path d="M17.6 6.4 14 10l-2-2 3.6-3.6a2.8 2.8 0 0 1 4 4Z"/>'),
  paint:IC('<rect x="3" y="3" width="18" height="7" rx="1.5"/><path d="M19 10v4a2 2 0 0 1-2 2h-5v2"/><rect x="9" y="18" width="4" height="4" rx="1"/>'),
  check:IC('<path d="m5 12 5 5 9-10"/>'),
  alert:IC('<path d="M12 3 2 20h20Z"/><path d="M12 9v5M12 17v.5"/>'),
};
function brand(){return `<div class="brandline"><div class="wm"><b>INDOWUD</b><span class="n">NFC</span></div><span class="meta">Technical Guidelines · Rev 2026</span></div>`;}
function run(n){return `<div class="run"><span>Technical Guidelines</span><span>${String(n).padStart(2,'0')} / ${String(window.PAGES.length).padStart(2,'0')}</span></div>`;}
function P(n,cls,inner){return `<section class="page ${cls||''}" data-screen-label="${String(n).padStart(2,'0')}">${cls&&cls.includes('cover')?'':brand()}<div class="pad">${inner}</div>${cls&&cls.includes('cover')?'':run(n)}</section>`;}
</script>
<script src="techguide-pages.js"></script>
<script>
  const deck=document.getElementById('deck');
  deck.innerHTML=window.PAGES.map((fn,i)=>fn(i+1)).join('');
  function fit(){const s=Math.min(1,(window.innerWidth-44)/1123);document.documentElement.style.setProperty('--z',s.toFixed(4));}
  fit();window.addEventListener('resize',fit);
</script>
</body>
</html>
