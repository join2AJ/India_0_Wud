<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>INDOWUD nfc — Product Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --ink-950:#15120E;--ink-900:#1C1813;--ink-800:#272219;--ink-700:#383024;--ink-600:#4B4133;
  --husk-50:#FBF8F1;--husk-100:#F5F0E4;--husk-200:#EDE6D5;--husk-300:#E2D8C2;
  --sand-300:#BBAD97;--sand-400:#9A8C76;--sand-500:#786A57;--sand-600:#594E3F;
  --leaf-700:#3C5230;--leaf-600:#4C6A3A;--leaf-500:#5E7E45;--leaf-400:#7E9C60;--leaf-300:#A6C08A;--leaf-200:#CCDCB8;--leaf-100:#E6EEDB;
  --fd:'Archivo',system-ui,sans-serif;--fb:'IBM Plex Sans',system-ui,sans-serif;--fm:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;background:#2A2620;font-family:var(--fb);color:var(--ink-700);}
.deck{display:flex;flex-direction:column;align-items:center;gap:22px;padding:34px 0 60px;}
.page{position:relative;width:1123px;height:794px;overflow:hidden;background:var(--husk-50);box-shadow:0 18px 50px rgba(0,0,0,.4);zoom:var(--z,1);}
.page.dark{background:var(--ink-950);color:var(--husk-100);}
.page.cream{background:var(--husk-100);}
.pad{position:absolute;inset:0;padding:54px 64px;display:flex;flex-direction:column;}
.brandline{position:absolute;top:28px;left:64px;right:64px;display:flex;justify-content:space-between;align-items:baseline;}
.wm{display:flex;align-items:baseline;gap:7px;}
.wm b{font-family:var(--fd);font-weight:800;font-size:15px;letter-spacing:-.01em;color:var(--ink-900);}
.dark .wm b{color:var(--husk-50);}
.wm .n{font-family:var(--fm);font-size:8px;font-weight:600;letter-spacing:.24em;color:var(--leaf-600);border:1px solid var(--leaf-500);padding:1px 4px;border-radius:3px;}
.dark .wm .n{color:var(--leaf-300);}
.brandline .meta{font-family:var(--fm);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--sand-400);}
.run{position:absolute;left:64px;right:64px;bottom:28px;display:flex;justify-content:space-between;font-family:var(--fm);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--sand-400);}
.dark .run{color:var(--sand-300);}
.eyebrow{font-family:var(--fm);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--leaf-600);margin:0;}
.dark .eyebrow{color:var(--leaf-300);}
h1.disp{font-family:var(--fd);font-weight:800;letter-spacing:-.025em;line-height:.98;color:var(--ink-900);margin:0;}
.dark h1.disp{color:var(--husk-50);}
h2.head{font-family:var(--fd);font-weight:700;letter-spacing:-.02em;line-height:1.04;color:var(--ink-900);margin:0;}
p.body{font-family:var(--fb);font-size:14px;line-height:1.6;color:var(--ink-600);margin:0;}
.lede{font-size:18px;line-height:1.55;color:var(--ink-700);}
.dark .lede{color:var(--husk-100);}
.rule{height:2px;background:var(--ink-900);width:48px;border:0;}
.spec .row{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--husk-300);}
.spec .k{font-family:var(--fm);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--sand-500);}
.spec .v{font-family:var(--fb);font-size:13.5px;font-weight:600;color:var(--ink-900);text-align:right;}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--fm);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--leaf-700);background:var(--leaf-100);border:1px solid var(--leaf-200);padding:5px 10px;border-radius:999px;}
.tag{display:inline-flex;font-family:var(--fm);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--husk-50);background:var(--ink-900);padding:5px 10px;border-radius:4px;}
.photo{background:#fff;border:1px solid var(--husk-300);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 3px 10px rgba(40,32,20,.07);}
.photo img{max-width:100%;max-height:100%;object-fit:contain;}
table.dt{width:100%;border-collapse:collapse;font-family:var(--fb);font-size:12px;}
table.dt th{font-family:var(--fm);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--sand-500);text-align:left;padding:8px 10px;border-bottom:2px solid var(--ink-900);font-weight:500;}
table.dt td{padding:7px 10px;border-bottom:1px solid var(--husk-300);color:var(--ink-700);}
table.dt tr:nth-child(even) td{background:rgba(226,216,194,.28);}
table.dt td.num{text-align:right;font-family:var(--fm);}
table.dt td.hl{font-weight:700;color:var(--leaf-700);}
.mono{font-family:var(--fm);}
.deer{position:absolute;background-image:url('assets/brand/deer-family.png');background-size:contain;background-repeat:no-repeat;background-position:center;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip2{display:inline-flex;align-items:center;font-family:var(--fm);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--husk-100);background:rgba(242,234,217,.06);border:1px solid rgba(242,234,217,.16);padding:6px 11px;border-radius:999px;}
@media print{@page{size:A4 landscape;margin:0;}html,body{background:#fff;}.deck{display:block;gap:0;padding:0;}.page{zoom:1!important;box-shadow:none;break-after:page;page-break-after:always;}.page:last-child{break-after:auto;}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
function brand(){return `<div class="brandline"><div class="wm"><b>INDOWUD</b><span class="n">NFC</span></div><span class="meta">Product Catalogue · 2026</span></div>`;}
function run(n,name){return `<div class="run"><span>${name||'Product Catalogue'}</span><span>${String(n).padStart(2,'0')} / ${String(window.PAGES.length).padStart(2,'0')}</span></div>`;}
function P(n,cls,inner,name){return `<section class="page ${cls||''}" data-screen-label="${String(n).padStart(2,'0')}">${cls&&cls.includes('cover')?'':brand()}<div class="pad">${inner}</div>${cls&&cls.includes('cover')?'':run(n,name)}</section>`;}
</script>
<script src="catalogue-pages.js"></script>
<script>
  const deck=document.getElementById('deck');
  deck.innerHTML=window.PAGES.map((fn,i)=>fn(i+1)).join('');
  function fit(){const s=Math.min(1,(window.innerWidth-44)/1123);document.documentElement.style.setProperty('--z',s.toFixed(4));}
  fit();window.addEventListener('resize',fit);
</script>
</body>
</html>
